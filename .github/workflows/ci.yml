name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows first: it is the primary target, and the traps this project hit
    # (zip entry separators, path quoting, process handling) are Windows-specific.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Cross-layer consistency
        # Compares the Python tools, the add-on handlers and the privileged
        # forwarding list, and validates every add-on script. Node is preinstalled
        # on both runners, so the JavaScript syntax check runs too.
        run: python tools/check_consistency.py

      - name: Build the add-on package
        run: python tools/build_xpi.py build

      - name: Tool docs are in sync with the code
        run: |
          python tools/gen_tool_reference.py
          git diff --exit-code -- README.md docs/TOOL-REFERENCE.md

      - name: Server starts and registers every toolset
        run: python -m tbmcp tools --toolsets all

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        with:
          name: thunderbird-mcp-addon
          path: build/*.xpi
          if-no-files-found: error
